name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Lint and type check
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
      - name: Unit, contract, integration and evaluation tests
        run: uv run pytest
      - name: Generate, run every statement and apply the hard gates
        run: |
          uv run tse generate
          uv run tse run --all
          uv run tse eval --gate

  postgres:
    name: Postgres and fault scenarios
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tse
          POSTGRES_PASSWORD: tse
          POSTGRES_DB: tse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tse" --health-interval 2s --health-retries 20
    env:
      TSE_DATABASE_URL: postgresql+psycopg://tse:tse@localhost:5432/tse
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra postgres
      - name: Full run on Postgres with the hard gates
        run: |
          uv run tse generate
          uv run tse run --all
          uv run tse eval --gate
      - name: Resilience benchmark (clean, flaky, outage)
        run: uv run tse bench

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan full history
        run: gitleaks git . --redact --no-banner --exit-code 1
