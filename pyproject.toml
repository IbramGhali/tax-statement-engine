[project]
name = "tax-statement-engine"
version = "0.1.0"
description = "Multi-tenant quarterly sales-tax statement engine: deterministic figures, a validation engine that can block a run, and an LLM used only for reviewer commentary."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
tse = "tax_engine.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx2>=0.1",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tax_engine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["anthropic.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real LLM provider (excluded by default, set TSE_LIVE_TESTS=1)"]
addopts = "-m 'not live'"
